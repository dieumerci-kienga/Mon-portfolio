 <main>
    <h1>Me contacter</h1>
    <p>Vous avez un projet, une question ou une opportunité à partager ? N'hésitez pas à m'écrire !</p>
    <hr>
    <section>
      <h2>Formulaire de contact</h2>
      <form action="#">
        <label for="name">Nom complet</label>
        <input type="text" id="name" placeholder="Entrez votre Nom">

          <br>

        <label for="mail">Adresse e-mail</label>
        <input type="text" id="mail" placeholder="Entrez votre mail">
          <br>
          <label for="selection">Sujet</label>
          <select id="selection">
            <option value="">-- Choisisez un sujet-- </option>
            <option value="">Proposition de collaboration</option>
            <option value="">Offre de stage</option>
            <option value="">Question générale</option>
            <option value="">Autre</option>
          </select>
          <br>
          <label for="Message">Message</label>
          <br>
          <textarea id="Message" placeholder="Écrivez votre message ici..." cols="30" rows="5" ></textarea>
          <br>
          
          <input type="checkbox" id="cgv">
          <label for="cgv">J'accepte que mes données soient utilisées pour répondre à ma demande.</label>
          <br>
          <input type="submit" value="Envoyer le message">
      </form>
    </section>
    <hr>
